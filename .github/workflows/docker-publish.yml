name: Build and Push Docker Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to tag the image with (e.g. v1.2.0)'
        required: true
        type: string
      update_latest:
        description: 'Also update the "latest" tag?'
        required: false
        default: false
        type: boolean

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # Always include the SHA for traceability
            type=sha

            # Use the provided version on manual runs, otherwise fall back to the release tag
            type=raw,value=${{ github.event.inputs.version || github.event.release.tag_name }}

            # Semver tags only on real releases (when no manual version is provided)
            type=semver,pattern={{version}},enable=${{ github.event.inputs.version == '' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event.inputs.version == '' }}
            type=semver,pattern={{major}},enable=${{ github.event.inputs.version == '' }}

            # latest is updated on releases by default, or when manually requested
            type=raw,value=latest,enable=${{ github.event_name == 'release' || github.event.inputs.update_latest == true }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
