<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulseChain Validator Staking Launchpad • ValidatorStore</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="ethers.umd.min.js"></script>
  <style>body { font-family: system-ui, sans-serif; }</style>
</head>
<body class="bg-black text-white min-h-screen">

  <main class="max-w-4xl mx-auto p-8">

    <!-- HEADER: Logo + title + connection status -->
    <div class="flex justify-between items-start mb-12">
      <!-- Left side: Logo + RPC status -->
      <div class="flex flex-col">
        <a href="https://pulsechain.com" target="_blank" class="flex items-center gap-4">
          <img src="LogoTransparent.png" alt="PulseChain" class="h-14 w-auto">
        </a>
        <div id="rpcStatus" class="text-[10px] text-gray-400 mt-1"></div>
      </div>

      <!-- Right side: Title + Wallet status -->
      <div class="text-right">
        <div class="text-xs text-cyan-400 font-medium">PulseChain Validator Staking Launchpad</div>
        <div id="connectStatus" class="text-sm"></div>
      </div>
    </div>

    <!-- CONNECT WALLET SECTION -->
    <div class="bg-zinc-950 border border-cyan-900 rounded-3xl p-8 mb-8">
      <button id="connectBtn" type="button" class="w-full bg-gradient-to-r from-purple-600 via-cyan-500 to-cyan-400 hover:from-purple-700 hover:via-cyan-600 hover:to-cyan-500 py-5 rounded-2xl text-2xl font-bold transition">
        Connect Wallet
      </button>
      <button id="disconnectBtn" onclick="disconnectWallet()" class="hidden w-full mt-3 text-sm text-red-400 hover:text-red-300">
        Disconnect Wallet
      </button>
      <div id="balance" class="mt-4 text-center text-cyan-400 font-medium text-lg"></div>
    </div>

    <!-- UPLOAD DEPOSIT FILE SECTION -->
    <div class="bg-zinc-950 border border-cyan-900 rounded-3xl p-8 mb-8">
      <label class="block text-sm font-medium mb-3 text-cyan-300">Upload your deposit_data-*.json file</label>
      <input type="file" id="fileInput" accept=".json"
             class="block w-full text-sm text-gray-400 file:mr-4 file:py-4 file:px-8 file:rounded-2xl file:border-0 file:text-base file:font-semibold file:bg-gradient-to-r file:from-purple-600 file:via-cyan-500 file:to-cyan-400 file:text-white hover:file:brightness-110 cursor-pointer">
    </div>

    <!-- BEACON CHAIN NOTE (approved message) -->
    <div class="text-xs text-cyan-400 font-medium text-center mt-8 mb-8">
      It takes approximately 12 hours for stakes to show up as active on the Beacon chain. Please check back the next day to confirm the status of your stakes.
    </div>

    <!-- RESULTS SECTION (shown after file upload) -->
    <div id="results" class="hidden">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-3xl font-bold text-white">Your Validators</h2>
        <div id="summary" class="text-cyan-400 text-2xl font-bold"></div>
      </div>
      <div id="validatorList" class="space-y-4"></div>
    </div>

  </main>

  <footer class="text-center mt-20 text-xs text-gray-500 pb-8">
    Built for <a href="https://www.validatorstore.com/" target="_blank" class="text-cyan-400 hover:text-cyan-300">ValidatorStore.com</a> • PulseChain Validator Hardware<br>
    <span class="text-[10px]">Report <a href="https://github.com/DavidFeder/pulsechain-staking-launchpad-validatorstore/issues" target="_blank" class="text-cyan-400 hover:text-cyan-300">Bugs</a></span><br>
    <span id="app-version" class="text-[10px] text-cyan-400"></span>
  </footer>

  <script>
    // === APP VERSION ===
    const APP_VERSION = "1.2.2";

    // === DEBUG & STARTUP ===
    console.log(`=== PulseChain Staking — v${APP_VERSION} ===`);

    // === DOM ELEMENT REFERENCES ===
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const fileInput = document.getElementById('fileInput');
    const resultsDiv = document.getElementById('results');
    const validatorListDiv = document.getElementById('validatorList');
    const summaryDiv = document.getElementById('summary');
    const balanceDiv = document.getElementById('balance');
    const connectStatus = document.getElementById('connectStatus');
    const rpcStatusEl = document.getElementById('rpcStatus');

    // Display version in footer
    const versionEl = document.getElementById('app-version');
    if (versionEl) {
      versionEl.textContent = `v${APP_VERSION}`;
    }

    // === STATE VARIABLES ===
    let userAddress = null;
    let depositsData = [];
    let provider = null;
    let currentRpc = null;

    // === RPC CONFIG ===
    const PULSECHAIN_RPCS = [
      "https://rpc-pulsechain.g4mm4.io",
      "https://pulsechain-rpc.publicnode.com",
      "https://rpc.pulsechain.com",
      "https://rpc.gigatheminter.com"
    ];

    const RPC_DISPLAY_NAMES = {
      "https://rpc-pulsechain.g4mm4.io": "g4mm4",
      "https://pulsechain-rpc.publicnode.com": "PublicNode",
      "https://rpc.pulsechain.com": "pulsechain.com",
      "https://rpc.gigatheminter.com": "GigaTheminter"
    };

    function updateRpcStatus(rpc) {
      if (!rpcStatusEl) return;
      if (!rpc) {
        rpcStatusEl.textContent = "";
        return;
      }
      const name = RPC_DISPLAY_NAMES[rpc] || rpc;
      rpcStatusEl.textContent = `Connected via ${name}`;
    }

    // === PULSECHAIN RPC ENDPOINTS (with fallback) ===
    async function fetchBeacon(path) {
      for (const rpc of PULSECHAIN_RPCS) {
        try {
          const res = await fetch(`${rpc}/beacon-api${path}`, {
            signal: AbortSignal.timeout(7000)
          });
          if (res.ok) {
            if (currentRpc !== rpc) {
              currentRpc = rpc;
              updateRpcStatus(currentRpc);
            }
            return res;
          }
        } catch (e) {
          // try next RPC
        }
      }
      throw new Error("All RPC endpoints failed");
    }

    // === PULSECHAIN NETWORK SETUP ===
    async function ensurePulseChainNetwork() {
      const targetChainId = '0x171';
      try {
        await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: targetChainId }] });
        return true;
      } catch (switchError) {
        if (switchError.code === 4902) {
          try {
            await window.ethereum.request({
              method: 'wallet_addEthereumChain',
              params: [{
                chainId: targetChainId,
                chainName: 'PulseChain',
                nativeCurrency: { name: 'Pulse', symbol: 'PLS', decimals: 18 },
                rpcUrls: PULSECHAIN_RPCS,
                blockExplorerUrls: ['https://otter-pulsechain.g4mm4.io/']
              }]
            });
            await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: targetChainId }] });
            return true;
          } catch (addError) { return false; }
        }
        return false;
      }
    }

    // === WALLET CONNECTION LOGIC ===
    connectBtn.addEventListener('click', async () => {
      if (!window.ethereum) return alert("Wallet not found.");
      try {
        connectStatus.textContent = "Connecting...";
        const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
        userAddress = accounts[0];
        if (!(await ensurePulseChainNetwork())) return;
        provider = new ethers.providers.Web3Provider(window.ethereum);
        const bal = await provider.getBalance(userAddress);
        const pls = parseFloat(ethers.utils.formatEther(bal));
        connectStatus.innerHTML = `<span class="text-cyan-400">✅ Connected • ${userAddress.slice(0,6)}...${userAddress.slice(-4)}</span>`;
        balanceDiv.textContent = `Balance: ${pls.toFixed(4)} PLS`;
        connectBtn.textContent = "Connected ✓";
        connectBtn.disabled = true;
        disconnectBtn.classList.remove('hidden');

        // Show initial RPC (will be updated on first successful beacon call)
        updateRpcStatus(PULSECHAIN_RPCS[0]);
      } catch (err) {
        connectStatus.innerHTML = `<span class="text-red-500">Connection failed</span>`;
      }
    });

    // === DISCONNECT FUNCTION ===
    window.disconnectWallet = function() {
      userAddress = null;
      provider = null;
      currentRpc = null;
      connectBtn.textContent = "Connect Wallet";
      connectBtn.disabled = false;
      disconnectBtn.classList.add('hidden');
      balanceDiv.textContent = '';
      connectStatus.textContent = '';
      if (rpcStatusEl) rpcStatusEl.textContent = '';
      resultsDiv.classList.add('hidden');
      validatorListDiv.innerHTML = '';
    };

    // === FILE UPLOAD HANDLER ===
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result.trim());
          depositsData = Array.isArray(parsed) ? parsed : (parsed.data || parsed.validators || []);
          displayValidators(depositsData);
        } catch (err) { alert("Invalid deposit_data file."); }
      };
      reader.readAsText(file);
    });

    // === VALIDATOR DISPLAY ===
    function displayValidators(deposits) {
      validatorListDiv.innerHTML = '';
      resultsDiv.classList.remove('hidden');
      let readyCount = 0;
      deposits.forEach((deposit, index) => {
        const pubkey = cleanHex(deposit.pubkey || deposit.public_key || "");
        const div = document.createElement('div');
        div.className = "bg-zinc-950 border border-cyan-900 rounded-2xl p-6 flex items-center";
        div.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-3">
              <span class="text-xs bg-zinc-900 px-3 py-1 rounded-full">Validator #${index+1}</span>
              <button onclick="checkValidator('${pubkey}')" class="text-xs px-3 py-1 border border-cyan-700 hover:border-cyan-400 rounded-xl text-cyan-400 hover:bg-cyan-950 transition">
                Check on g4mm4.io
              </button>
            </div>
            <div class="font-mono text-sm text-cyan-400 break-all mt-2">${pubkey.slice(0,22)}...${pubkey.slice(-22)}</div>
            <div id="status-${index}" class="text-sm mt-3 font-medium"></div>
          </div>
          <button id="btn-${index}" onclick="makeDeposit(${index})" class="px-10 py-4 rounded-2xl font-bold text-base"></button>
        `;
        validatorListDiv.appendChild(div);
        checkPubkeyUsed(index, pubkey, () => { readyCount++; updateSummary(readyCount, deposits.length); });
      });
    }

    // === PUBKEY STATUS CHECK ===
    async function checkPubkeyUsed(index, rawPubkey, callback) {
      const statusEl = document.getElementById(`status-${index}`);
      const btn = document.getElementById(`btn-${index}`);
      let pubkey = cleanHex(rawPubkey);
      try {
        let response = await fetchBeacon(`/eth/v1/beacon/states/head/validators/${pubkey}`);
        if (response.status === 400) {
          response = await fetchBeacon(`/eth/v1/beacon/states/head/validators/${pubkey.slice(2)}`);
        }
        if (response.ok) {
          const json = await response.json();
          if (json.data && json.data.validator) {
            statusEl.innerHTML = `<span class="text-red-400">Already Deposited ❌</span>`;
            btn.textContent = "Already Deposited";
            btn.classList.add('bg-red-700', 'cursor-not-allowed');
            btn.disabled = true;
            return;
          }
        }
      } catch (e) {}
      statusEl.innerHTML = `<span class="text-cyan-400">Ready for deposit ✅</span>`;
      btn.textContent = "Deposit with Wallet";
      btn.classList.add('bg-gradient-to-r', 'from-purple-600', 'via-cyan-500', 'to-cyan-400', 'hover:from-purple-700', 'hover:via-cyan-600', 'hover:to-cyan-500');
      callback();
    }

    // === HELPER: CLEAN HEX ===
    function cleanHex(str) {
      if (!str) return "0x";
      str = str.trim();
      return str.startsWith("0x") ? str : "0x" + str;
    }

    // === SUMMARY UPDATER ===
    function updateSummary(readyCount, total) {
      summaryDiv.textContent = `${readyCount} of ${total} ready for deposit`;
    }

    // === OPEN VALIDATOR CHECK ===
    window.checkValidator = function(pubkey) {
      window.open(`https://www.g4mm4.io/validator/${pubkey}`, '_blank');
    };

    // === ROBUST TX CONFIRMATION (multi-RPC fallback) ===
    async function waitForTransactionConfirmation(txHash, maxWaitMs = 300000) {
      const startTime = Date.now();
      const pollInterval = 3000; // poll every 3s

      while (Date.now() - startTime < maxWaitMs) {
        for (const rpcUrl of PULSECHAIN_RPCS) {
          try {
            const tempProvider = new ethers.providers.JsonRpcProvider(rpcUrl);
            const receipt = await tempProvider.getTransactionReceipt(txHash);
            if (receipt && receipt.blockNumber != null) {
              if (receipt.status === 1) {
                console.log(`[Confirmation] Success via ${rpcUrl}`);
                return { success: true, receipt };
              } else {
                console.log(`[Confirmation] Reverted via ${rpcUrl}`);
                return { success: false, receipt };
              }
            }
          } catch (e) {
            // try next RPC
            continue;
          }
        }
        await new Promise(resolve => setTimeout(resolve, pollInterval));
      }
      console.warn(`[Confirmation] Timeout waiting for ${txHash}`);
      return { success: false, receipt: null };
    }

    // === DEPOSIT FUNCTION ===
    window.makeDeposit = async function(index) {
      if (!userAddress) return alert("Please connect a wallet first");
      const deposit = depositsData[index];
      const btn = document.getElementById(`btn-${index}`);
      if (btn.disabled) return;

      const pubkey = cleanHex(deposit.pubkey || deposit.public_key || "");
      const withdrawalCredentials = cleanHex(deposit.withdrawal_credentials || "");
      const signature = cleanHex(deposit.signature || "");
      const depositDataRoot = cleanHex(deposit.deposit_data_root || deposit.deposit_message_root || "");

      const balance = await provider.getBalance(userAddress);
      const plsBalance = parseFloat(ethers.utils.formatEther(balance));
      if (plsBalance < 32000000.01) {
        return alert(`Not enough PLS!\n\nYou have ${plsBalance.toFixed(4)} PLS\nNeed at least 32,000,000.01 PLS`);
      }

      if (!confirm(`Deposit 32,000,000 PLS for Validator #${index+1}?`)) return;

      // Disable button immediately to prevent double-clicks during async processing
      btn.disabled = true;

      const statusDiv = document.getElementById(`status-${index}`);
      statusDiv.innerHTML = `<span class="text-yellow-400">Sending transaction...</span>`;

      try {
        const signer = provider.getSigner();
        const contract = new ethers.Contract(
          "0x3693693693693693693693693693693693693693",
          ["function deposit(bytes calldata pubkey, bytes calldata withdrawal_credentials, bytes calldata signature, bytes32 deposit_data_root) payable"],
          signer
        );

        const tx = await contract.deposit(pubkey, withdrawalCredentials, signature, depositDataRoot, {
          value: ethers.utils.parseEther("32000000"),
          gasLimit: 250000,
          maxFeePerGas: ethers.utils.parseUnits("0.02", "gwei"),
          maxPriorityFeePerGas: ethers.utils.parseUnits("0.005", "gwei")
        });

        statusDiv.innerHTML = `⏳ <a href="https://otter-pulsechain.g4mm4.io/tx/${tx.hash}" target="_blank" class="underline">View on explorer</a>`;

        // Primary wait (fast if wallet RPC is healthy) + multi-RPC fallback
        let confirmationResult;
        try {
          await tx.wait(1);
          confirmationResult = { success: true };
        } catch (waitErr) {
          console.warn("Primary tx.wait() failed — falling back to multi-RPC polling...", waitErr);
          confirmationResult = await waitForTransactionConfirmation(tx.hash);
        }

        if (confirmationResult.success) {
          statusDiv.innerHTML = `<span class="text-cyan-400">✅ Deposit confirmed!</span>`;
          btn.textContent = "Deposited ✓";
          btn.classList.add('bg-zinc-800', 'cursor-not-allowed');
          btn.disabled = true;
        } else {
          statusDiv.innerHTML = `<span class="text-red-500">Transaction failed or not yet confirmed</span>`;
          alert("Transaction may have failed, been replaced, or is still pending. Please check the explorer link above.");
          btn.disabled = false; // allow retry
        }
      } catch (err) {
        console.error(err);
        let msg = "Transaction failed";
        const lowerMsg = (err.message || "").toLowerCase();

        if (err.code === 4001 || lowerMsg.includes("user rejected") || lowerMsg.includes("denied")) {
          msg = "Transaction rejected by user";
        } else if (lowerMsg.includes("insufficient funds")) {
          msg = "Insufficient funds for gas";
        } else if (lowerMsg.includes("gas")) {
          msg = "Gas estimation / price error";
        }

        statusDiv.innerHTML = `<span class="text-red-500">${msg}</span>`;
        alert(`${msg}. Check your wallet and try again.`);
        btn.disabled = false; // allow retry
      }
    };
  </script>
</body>
</html>
